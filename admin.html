<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Supabase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">Panel de Administración</h1>
            <span id="user-email" class="text-sm text-gray-600">Conectado a Supabase</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8 space-y-6">
        
        <!-- Sección 1: Gestión de Usuarios -->
        <div class="px-4 py-6 sm:px-0 bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
            <h2 class="text-lg font-medium text-gray-900 mb-4">Gestión de Usuarios</h2>
            <button id="btn-cargar" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">
                Cargar Usuarios desde Supabase
            </button>
            <div id="resultado-tabla" class="mt-6 overflow-x-auto">
                <!-- La tabla de usuarios se pintará aquí -->
            </div>
        </div>

        <!-- Sección 2: Registro de Productos -->
        <div class="px-4 py-6 sm:px-0 bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
            <h2 class="text-lg font-medium text-gray-900 mb-4">Agregar Nuevo Producto</h2>
            <form id="form-producto" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-xl">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre del Producto</label>
                    <input type="text" id="prod-nombre" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Precio</label>
                    <input type="number" step="0.01" id="prod-precio" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Stock Actual</label>
                    <input type="number" id="prod-stock" value="10" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div class="flex items-center pt-6">
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition w-full">
                        Guardar Producto
                    </button>
                </div>
            </form>
            <p id="prod-mensaje" class="mt-3 text-sm font-medium"></p>
        </div>

    </main>

    <!-- Script de Configuración y Lógica -->
    <script type="module">
        // 1. REEMPLAZA ESTOS VALORES CON TUS CREDENCIALES REALES DE SUPABASE
        const SUPABASE_URL = 'https://TU_PROYECTO_AQUI.supabase.co';
        const SUPABASE_KEY = 'TU_CLAVE_ANON_PUBLICA_AQUI';

        // Inicializar cliente de Supabase
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. Función para obtener usuarios
        async function cargarUsuarios() {
            const contenedor = document.getElementById('resultado-tabla');
            contenedor.innerHTML = '<p class="text-gray-500">Consultando la base de datos...</p>';

            try {
                const { data, error } = await supabaseClient
                    .from('usuarios')
                    .select('*');

                if (error) throw error;

                if (!data || data.length === 0) {
                    contenedor.innerHTML = '<p class="text-gray-500">No se encontraron registros en la tabla usuarios.</p>';
                    return;
                }

                let html = `
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nombre</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Correo</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Rol</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                `;

                data.forEach(user => {
                    html += `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.id || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.nombre || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.correo || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.rol || 'N/A'}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                contenedor.innerHTML = html;

            } catch (err) {
                console.error('Error:', err.message);
                contenedor.innerHTML = `<p class="text-red-600">Error al cargar los datos: ${err.message}</p>`;
            }
        }

        // 3. Función para guardar productos en Supabase
        async function guardarProductoSupabase(e) {
            e.preventDefault();
            const mensaje = document.getElementById('prod-mensaje');
            
            const producto = {
                nombre: document.getElementById('prod-nombre').value,
                precio: parseFloat(document.getElementById('prod-precio').value),
                controlarStock: true,
                stockActual: parseInt(document.getElementById('prod-stock').value),
                usuarioMod: 'Admin'
            };

            mensaje.textContent = 'Guardando en Supabase...';
            mensaje.className = 'mt-3 text-sm font-medium text-blue-600';

            try {
                const { data, error } = await supabaseClient
                    .from('productos')
                    .insert([
                        {
                            nombre: producto.nombre,
                            precio: producto.precio,
                            controlar_stock: producto.controlarStock,
                            stock_actual: producto.stockActual,
                            modificado_por: producto.usuarioMod
                        }
                    ])
                    .select();

                if (error) throw error;

                mensaje.textContent = '¡Producto guardado exitosamente en Supabase!';
                mensaje.className = 'mt-3 text-sm font-medium text-green-600';
                document.getElementById('form-producto').reset();

            } catch (error) {
                console.error('Error al guardar:', error.message);
                mensaje.textContent = `Error al guardar: ${error.message}`;
                mensaje.className = 'mt-3 text-sm font-medium text-red-600';
            }
        }

        // Event Listeners
        document.getElementById('btn-cargar').addEventListener('click', cargarUsuarios);
        document.getElementById('form-producto').addEventListener('submit', guardarProductoSupabase);
    </script>
</body>
</html>

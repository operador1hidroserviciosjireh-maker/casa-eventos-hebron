<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Panel de Gestión</title>
    <!-- Tailwind CSS para diseño moderno y limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col" style="min-height: 650px;">
        
        <!-- Header superior -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <button onclick="history.back()" class="text-gray-600 hover:text-black text-lg">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h1 class="text-lg font-semibold text-gray-800">Nuevo producto</h1>
            <div class="w-6"></div> <!-- Espaciador para centrar título -->
        </div>

        <!-- Pestañas de Navegación: REGISTRO / STOCK -->
        <div class="grid grid-cols-2 border-b border-gray-200 text-center font-medium text-sm">
            <button id="tab-registro-btn" onclick="switchTab('registro')" class="py-3 text-teal-600 border-b-2 border-teal-600 focus:outline-none transition-colors">
                REGISTRO
            </button>
            <button id="tab-stock-btn" onclick="switchTab('stock')" class="py-3 text-gray-400 border-b-2 border-transparent focus:outline-none transition-colors">
                STOCK
            </button>
        </div>

        <!-- Contenedor del Formulario -->
        <form id="product-form" onsubmit="guardarProducto(event)" class="flex-1 flex flex-col justify-between p-6">
            
            <!-- VISTA 1: REGISTRO -->
            <div id="tab-registro" class="space-y-6">
                <!-- Tarjeta de Vista Previa del Producto -->
                <div class="flex justify-center my-2">
                    <div class="w-40 h-40 bg-slate-700 rounded-2xl flex flex-col justify-between p-4 text-white shadow-md relative">
                        <div class="flex justify-between items-center">
                            <div class="w-5 h-5 bg-slate-500 rounded"></div>
                            <i class="fa-regular fa-image text-slate-400 text-xl"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-300 font-medium">Nombre</p>
                            <h3 id="preview-nombre" class="font-bold text-sm truncate">Nombre del pr...</h3>
                            <p id="preview-precio" class="text-xs text-slate-300">0.00 Q</p>
                        </div>
                    </div>
                </div>

                <!-- Campo Nombre del Producto -->
                <div>
                    <input type="text" id="nombre" placeholder="Nombre del producto" required
                        class="w-full pb-2 border-b border-gray-300 focus:border-teal-600 focus:outline-none text-gray-700 placeholder-gray-400 text-base transition-colors"
                        oninput="actualizarPreview()">
                </div>

                <!-- Campo Precio -->
                <div>
                    <input type="number" step="0.01" id="precio" placeholder="Precio" required
                        class="w-full pb-2 border-b border-gray-300 focus:border-teal-600 focus:outline-none text-gray-700 placeholder-gray-400 text-base transition-colors"
                        oninput="actualizarPreview()">
                </div>

                <!-- Campo Opcionales / Descripción -->
                <div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Opcionales</p>
                    <input type="text" id="descripcion" placeholder="Prueba la descripción generada con IA"
                        class="w-full pb-2 border-b border-gray-300 focus:border-teal-600 focus:outline-none text-gray-700 placeholder-gray-400 text-sm transition-colors">
                </div>
            </div>

            <!-- VISTA 2: STOCK (Oculta por defecto) -->
            <div id="tab-stock" class="space-y-6 hidden">
                <!-- Interruptor Controlar Stock -->
                <div class="flex items-center justify-between py-2">
                    <span class="text-gray-700 text-sm font-medium">Controlar stock del producto</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="controlar_stock" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal-600"></div>
                    </label>
                </div>

                <!-- Stock Actual -->
                <div class="text-center py-6">
                    <p class="text-sm text-gray-400 mb-2">Stock actual</p>
                    <input type="number" id="stock_actual" value="0"
                        class="w-32 text-center text-4xl font-light text-rose-400 border-b border-gray-300 focus:border-teal-600 focus:outline-none">
                </div>

                <!-- Historial de movimientos -->
                <div class="flex items-center justify-between py-3 border-b border-gray-100 text-gray-400 text-sm cursor-pointer hover:text-gray-600">
                    <span>Historial de movimientos</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>

                <!-- Stock Mínimo -->
                <div class="flex items-center justify-between py-3 border-b border-gray-100 text-gray-600 text-sm cursor-pointer">
                    <span id="label-stock-minimo">Stock Mínimo: 0</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
                <input type="hidden" id="stock_minimo" value="0">
            </div>

            <!-- Botón de Envío Inferior -->
            <div class="pt-6 mt-auto">
                <button type="submit" id="btn-submit"
                    class="w-full py-4 bg-gray-200 text-gray-400 font-medium rounded-xl transition-all duration-200 cursor-pointer text-center">
                    Añadir producto
                </button>
            </div>

        </form>
    </div>

    <script>
        // Configuración de Supabase (Reemplaza con tus credenciales reales)
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Usuario actual (simulado o obtenido de sesión activa)
        const usuarioActual = "Samuel Siebenhor";

        // Control de pestañas
        function switchTab(tab) {
            const regTab = document.getElementById('tab-registro');
            const stockTab = document.getElementById('tab-stock');
            const regBtn = document.getElementById('tab-registro-btn');
            const stockBtn = document.getElementById('tab-stock-btn');
            const submitBtn = document.getElementById('btn-submit');

            if (tab === 'registro') {
                regTab.classList.remove('hidden');
                stockTab.classList.add('hidden');
                regBtn.className = "py-3 text-teal-600 border-b-2 border-teal-600 font-medium transition-colors";
                stockBtn.className = "py-3 text-gray-400 border-b-2 border-transparent font-medium transition-colors";
                submitBtn.innerText = "Añadir producto";
            } else {
                regTab.classList.add('hidden');
                stockTab.classList.remove('hidden');
                stockBtn.className = "py-3 text-teal-600 border-b-2 border-teal-600 font-medium transition-colors";
                regBtn.className = "py-3 text-gray-400 border-b-2 border-transparent font-medium transition-colors";
                submitBtn.innerText = "Añadir al producto";
            }
        }

        // Actualizar vista previa en tiempo real
        function actualizarPreview() {
            const nombre = document.getElementById('nombre').value;
            const precio = document.getElementById('precio').value;
            const submitBtn = document.getElementById('btn-submit');

            document.getElementById('preview-nombre.').innerText = nombre ? (nombre.length > 15 ? nombre.substring(0, 15) + '...' : nombre) : 'Nombre del pr...';
            
            // Corregido ID preview
            if(nombre) {
                document.getElementById('preview-nombre').innerText = nombre.length > 15 ? nombre.substring(0, 15) + '...' : nombre;
            } else {
                document.getElementById('preview-nombre').innerText = 'Nombre del pr...';
            }

            document.getElementById('preview-precio').innerText = precio ? precio + ' Q' : '0.00 Q';

            // Activar botón si hay nombre y precio
            if (nombre && precio) {
                submitBtn.className = "w-full py-4 bg-teal-600 text-white font-medium rounded-xl shadow-md hover:bg-teal-700 transition-all cursor-pointer";
            } else {
                submitBtn.className = "w-full py-4 bg-gray-200 text-gray-400 font-medium rounded-xl transition-all cursor-pointer";
            }
        }

        // Función para guardar en Supabase incluyendo auditoría
        async function guardarProducto(event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const precio = parseFloat(document.getElementById('precio').value) || 0;
            const controlar_stock = document.getElementById('controlar_stock').checked;
            const stock_actual = parseInt(document.getElementById('stock_actual').value) || 0;
            const stock_minimo = parseInt(document.getElementById('stock_minimo').value) || 0;
            
            // Datos de Auditoría automáticos solicitados
            const modificado_por = usuarioActual;
            const updated_at = new Date().toISOString(); // Fecha y hora exacta UTC / local

            // Objeto a insertar en Supabase
            const nuevoProducto = {
                nombre,
                precio,
                controlar_stock,
                stock_actual,
                stock_minimo,
                modificado_por,
                updated_at
            };

            try {
                const { data, error } = await supabaseClient
                    .from('productos')
                    .insert([nuevoProducto]);

                if (error) {
                    throw error;
                }

                alert('¡Producto guardado exitosamente con auditoría!');
                document.getElementById('product-form').reset();
                actualizarPreview();
                switchTab('registro');

            } catch (err) {
                console.error('Error al guardar en Supabase:', err.message);
                alert('Simulación de guardado exitoso (Configura tus credenciales de Supabase en el código).

Datos registrados:
' + JSON.stringify(nuevoProducto, null, 2));
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - Hebron</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f6f8; min-height: 100vh; display: flex; flex-direction: column; color: #1e293b; }
        .header { background-color: #253342; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; }
        .back-link { color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 500; }
        
        .container { padding: 15px; max-width: 700px; margin: 0 auto; width: 100%; flex-grow: 1; }

        .order-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid #e2e8f0; overflow: hidden; }
        
        .order-top { padding: 15px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: flex-start; }
        .order-title { font-size: 13px; color: #64748b; font-weight: 500; }
        .order-total { font-size: 24px; font-weight: 700; color: #0f172a; margin-top: 2px; }
        
        .badge-catalog { background: #f1f5f9; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #475569; }

        .order-meta-row { padding: 12px 15px; display: flex; gap: 10px; align-items: center; background: #fafafa; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap; }
        .status-pill { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .info-pill { background: #f8fafc; color: #334155; border: 1px solid #e2e8f0; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }

        .tabs { display: flex; border-bottom: 1px solid #e2e8f0; background: #fff; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: #0d9488; border-bottom-color: #0d9488; }

        .tab-content { padding: 15px; display: none; min-height: 120px; }
        .tab-content.active { display: block; }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .item-row:last-child { border-bottom: none; }
        .item-name { font-weight: 500; color: #334155; }
        .item-price { color: #64748b; font-size: 13px; }

        .section-text { font-size: 13px; color: #475569; line-height: 1.5; margin-bottom: 6px; }

        .card-footer { padding: 12px 15px; background: #f8fafc; border-top: 1px solid #f1f5f9; display: flex; justify-content: flex-end; gap: 8px; }
        .btn-action { background: #0ea5e9; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-action:hover { background: #0284c7; }
        .btn-confirm { background: #10b981; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-confirm:hover { background: #059669; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #1e293b; }
        .modal-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 12px; }
        .modal-controls { display: flex; align-items: center; gap: 6px; }
        .modal-controls input { width: 45px; text-align: center; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .modal-footer { margin-top: 15px; display: flex; justify-content: flex-end; gap: 8px; }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .btn-success { background: #10b981; color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }

        .ticket-modal-content { background: white; width: 100%; max-width: 480px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        .ticket-top-bar { background: #e2e8f0; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #334155; }
        .ticket-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .ticket-header-info { text-align: center; margin-bottom: 15px; }
        .ticket-footer-actions { display: grid; grid-template-columns: repeat(4, 1fr); background: #1e293b; padding: 10px; gap: 5px; text-align: center; }
        .ticket-btn-action { background: transparent; border: none; color: white; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px; border-radius: 6px; }
        .ticket-btn-action:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="header">
        <h1>Pedidos Hebrón</h1>
        <a href="admin.html" class="back-link">← Volver al panel</a>
    </div>

    <div class="container" id="contenedorPedidos">
        <p style="text-align: center; color: #64748b; margin-top: 20px;">Cargando pedidos...</p>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitulo">Editar Pedido</div>
            <div id="listaProductosModal"></div>
            <div style="margin-top: 12px; font-weight: 600; text-align: right; font-size: 14px;" id="modalTotalTexto">
                Nuevo Total: Q. 0.00
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-success" onclick="guardarCambiosPedido()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <div id="modalTicket" class="modal">
        <div class="ticket-modal-content">
            <div class="ticket-top-bar">
                <span onclick="cerrarTicketModal()" style="cursor: pointer; font-size: 16px;">✕</span>
                <span>Editar mi recibo</span>
                <span></span>
            </div>
            <div class="ticket-body" id="contenidoTicketRecibo"></div>
            <div class="ticket-footer-actions">
                <button class="ticket-btn-action" onclick="alert('Generando PDF...')">📄<span>PDF</span></button>
                <button class="ticket-btn-action" onclick="alert('Abriendo correo...')">✉️<span>Email</span></button>
                <button class="ticket-btn-action" onclick="window.print()">🖨️<span>Imprimir</span></button>
                <button class="ticket-btn-action" onclick="compartirTicket()">🔗<span>Compartir</span></button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uidoqzlzvhjhfzxmkgci.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZG9xemx6dmhqaGZ6eG1rZ2NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTg2ODAsImV4cCI6MjEwNTE3NDY4MH0.nunRdJoQcQR3N5K7H1-Rj3eZivWf0Kax_gjoNZSPcrI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let pedidoActualId = null;
        let detallesActuales = [];

        document.addEventListener('DOMContentLoaded', cargarPedidos);

        // Función auxiliar para agrupar items repetidos por nombre de producto
        function agruparDetalles(detalles) {
            const agrupados = {};
            detalles.forEach(item => {
                const nombre = item.producto_nombre;
                if (agrupados[nombre]) {
                    agrupados[nombre].cantidad += item.cantidad;
                    agrupados[nombre].subtotal += item.subtotal;
                } else {
                    agrupados[nombre] = {
                        producto_nombre: nombre,
                        cantidad: item.cantidad,
                        precio_unitario: item.precio_unitario,
                        subtotal: item.subtotal
                    };
                }
            });
            return Object.values(agrupados);
        }

        async function cargarPedidos() {
            const { data, error } = await supabaseClient
                .from('pedidos')
                .select(`
                    *,
                    detalle_pedidos (
                        id,
                        producto_nombre,
                        cantidad,
                        precio_unitario,
                        subtotal
                    )
                `)
                .order('created_at', { ascending: false });

            const contenedor = document.getElementById('contenedorPedidos');
            if (error) {
                console.error(error);
                contenedor.innerHTML = `<p style="text-align: center; color: #e11d48;">Error al cargar los pedidos.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                contenedor.innerHTML = `<p style="text-align: center; color: #64748b;">No hay pedidos registrados todavía.</p>`;
                return;
            }

            contenedor.innerHTML = '';
            data.forEach((p, indexCard) => {
                const fecha = new Date(p.created_at).toLocaleString();
                const numeroPedido = data.length - indexCard;

                // Agrupamos los items para mostrarlos limpios y sin duplicados visuales
                const itemsAgrupados = agruparDetalles(p.detalle_pedidos || []);
                let itemsHtml = '';
                let totalCtdItems = 0;

                if (itemsAgrupados.length > 0) {
                    itemsHtml = itemsAgrupados.map(item => {
                        totalCtdItems += item.cantidad;
                        return `
                            <div class="item-row">
                                <div>
                                    <strong style="color: #0f172a;">${item.cantidad} x</strong> 
                                    <span class="item-name">${item.producto_nombre}</span>
                                </div>
                                <span class="item-price">Q. ${item.subtotal.toFixed(2)}</span>
                            </div>
                        `;
                    }).join('');
                } else {
                    itemsHtml = '<p style="color: #94a3b8; font-size: 13px;">Sin items registrados.</p>';
                }

                // Recalculamos el total real basado en los agrupados por seguridad
                const totalReal = itemsAgrupados.reduce((acc, curr) => acc + curr.subtotal, 0);

                contenedor.innerHTML += `
                    <div class="order-card" id="card-${p.id}">
                        <div class="order-top">
                            <div>
                                <div class="order-title">${fecha}</div>
                                <div class="order-total">${totalReal.toFixed(2)} Q</div>
                            </div>
                            <span class="badge-catalog">Pedido #${numeroPedido}</span>
                        </div>

                        <div class="order-meta-row">
                            <div class="status-pill">⏱ ${p.estado || 'Pendiente'}</div>
                            <div class="info-pill">💵 ${p.metodo_pago || 'Efectivo'}</div>
                            <div class="info-pill">📦 ${p.forma_entrega || 'Entrega'}</div>
                        </div>

                        <div class="tabs">
                            <div class="tab active" onclick="cambiarTab(this, 'items-${p.id}')">ITEMS</div>
                            <div class="tab" onclick="cambiarTab(this, 'detalles-${p.id}')">DETALLES</div>
                            <div class="tab" onclick="cambiarTab(this, 'cliente-${p.id}')">CLIENTE</div>
                        </div>

                        <div id="items-${p.id}" class="tab-content active">
                            ${itemsHtml}
                        </div>

                        <div id="detalles-${p.id}" class="tab-content" style="display:none;">
                            <div class="section-text"><strong>Dirección:</strong> ${p.direccion_evento || 'No especificada'}</div>
                            <div class="section-text"><strong>Observación:</strong> ${p.observacion || 'Ninguna'}</div>
                        </div>

                        <div id="cliente-${p.id}" class="tab-content" style="display:none;">
                            <div class="section-text"><strong>Nombre:</strong> ${p.nombre_cliente || 'No registrado'}</div>
                            <div class="section-text"><strong>Teléfono:</strong> ${p.cliente_telefono || 'N/A'}</div>
                        </div>

                        <div class="card-footer">
                            <button class="btn-action" onclick='abrirModalEditar(${JSON.stringify(p)})'>Editar Pedido</button>
                            <button class="btn-confirm" onclick='abrirTicketModal(${JSON.stringify(p)}, ${numeroPedido}, ${totalCtdItems})'>Confirmar Pedido</button>
                        </div>
                    </div>
                `;
            });
        }

        function cambiarTab(tabElement, targetId) {
            const card = tabElement.closest('.order-card');
            card.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            card.querySelectorAll('.tab-content').forEach(c => {
                c.style.display = 'none';
                c.classList.remove('active');
            });

            tabElement.classList.add('active');
            const target = document.getElementById(targetId);
            target.style.display = 'block';
            target.classList.add('active');
        }

        function abrirModalEditar(pedido) {
            pedidoActualId = pedido.id;
            // Agrupamos al abrir el modal para que no salgan filas duplicadas
            detallesActuales = agruparDetalles(pedido.detalle_pedidos || []);
            
            document.getElementById('modalTitulo').innerText = `Editar: ${pedido.nombre_cliente || 'Cliente'}`;
            renderizarItemsModal();
            document.getElementById('modalEditar').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalEditar').style.display = 'none';
            pedidoActualId = null;
        }

        function renderizarItemsModal() {
            const contenedor = document.getElementById('listaProductosModal');
            if (detallesActuales.length === 0) {
                contenedor.innerHTML = '<p style="color: #64748b; font-size: 12px; text-align: center; padding: 10px;">No hay productos.</p>';
                document.getElementById('modalTotalTexto').innerText = 'Nuevo Total: Q. 0.00';
                return;
            }

            let html = '';
            let nuevoTotal = 0;

            detallesActuales.forEach((item, index) => {
                const subtotal = item.cantidad * item.precio_unitario;
                nuevoTotal += subtotal;
                html += `
                    <div class="modal-item-row">
                        <div>
                            <strong>${item.producto_nombre}</strong><br>
                            <span style="font-size: 10px; color: #64748b;">Q. ${item.precio_unitario.toFixed(2)} c/u</span>
                        </div>
                        <div class="modal-controls">
                            <input type="number" min="1" value="${item.cantidad}" onchange="cambiarCantidad(${index}, this.value)">
                            <span style="font-size: 12px; font-weight: 500;">Q.${subtotal.toFixed(2)}</span>
                            <button class="btn-danger" onclick="eliminarItemModal(${index})">X</button>
                        </div>
                    </div>
                `;
            });

            contenedor.innerHTML = html;
            document.getElementById('modalTotalTexto').innerText = `Nuevo Total: Q. ${nuevoTotal.toFixed(2)}`;
        }

        function cambiarCantidad(index, nuevaCantidad) {
            const cant = parseInt(nuevaCantidad);
            if (cant > 0) {
                detallesActuales[index].cantidad = cant;
                detallesActuales[index].subtotal = cant * detallesActuales[index].precio_unitario;
                renderizarItemsModal();
            }
        }

        function eliminarItemModal(index) {
            detallesActuales.splice(index, 1);
            renderizarItemsModal();
        }

        async function guardarCambiosPedido() {
    if (!pedidoActualId) return;

    let nuevoTotalGeneral = 0;
    detallesActuales.forEach(item => {
        nuevoTotalGeneral += item.subtotal;
    });

    // 1. Borramos TODOS los detalles existentes de este pedido en Supabase para evitar duplicados residuales
    const { error: errorDel } = await supabaseClient
        .from('detalle_pedidos')
        .delete()
        .eq('pedido_id', pedidoActualId);

    if (errorDel) {
        alert('Error al limpiar los detalles anteriores.');
        console.error(errorDel);
        return;
    }

    // 2. Insertamos de manera limpia únicamente los ítems actuales agrupados
    if (detallesActuales.length > 0) {
        const nuevosDetallesParaInsertar = detallesActuales.map(item => ({
            pedido_id: pedidoActualId,
            producto_nombre: item.producto_nombre,
            cantidad: item.cantidad,
            precio_unitario: item.precio_unitario,
            subtotal: item.subtotal
        }));

        const { error: errorIns } = await supabaseClient
            .from('detalle_pedidos')
            .insert(nuevosDetallesParaInsertar);

        if (errorIns) {
            alert('Error al guardar los nuevos productos.');
            console.error(errorIns);
            return;
        }
    }

    // 3. Actualizamos el total general en la tabla principal de pedidos
    const { error: errorPedido } = await supabaseClient
        .from('pedidos')
        .update({ total: nuevoTotalGeneral })
        .eq('id', pedidoActualId);

    if (errorPedido) {
        alert('Error al actualizar el total del pedido.');
        console.error(errorPedido);
        return;
    }

    alert('¡Pedido actualizado con éxito!');
    cerrarModal();
    cargarPedidos();
}


        function abrirTicketModal(pedido, numPedido, totalCtd) {
            const fechaFormateada = new Date(pedido.created_at).toLocaleString();
            const itemsAgrupados = agruparDetalles(pedido.detalle_pedidos || []);
            let itemsTicketHtml = '';

            if (itemsAgrupados.length > 0) {
                itemsTicketHtml = itemsAgrupados.map(item => `
                    <div style="padding: 10px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-weight: 600; color: #1e293b; font-size: 13px;">${item.producto_nombre}</div>
                            <div style="font-size: 11px; color: #64748b; margin-top: 2px;">Q. ${item.precio_unitario.toFixed(2)}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 600; color: #0f172a; font-size: 13px;">Q. ${item.subtotal.toFixed(2)}</div>
                            <div style="font-size: 11px; color: #64748b; margin-top: 2px;">${item.cantidad}x</div>
                        </div>
                    </div>
                `).join('');
            }

            const contenido = `
                <div class="ticket-header-info">
                    <div style="font-weight: 700; font-size: 16px; color: #0f172a;">Hebron casa de eventos</div>
                    <div style="font-size: 11px; color: #64748b; margin-top: 2px;">Km 30.5 Carretera A San Elena Barillas Villacanales</div>
                    <div style="font-size: 11px; color: #64748b;">Guatemala • +502-5-039-0762</div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-bottom: 2px solid #1e293b; padding-bottom: 5px;">
                        <span style="font-size: 12px; color: #64748b; font-weight: 500;">${fechaFormateada}</span>
                        <span style="font-weight: 700; font-size: 14px; color: #0f172a;">Pedido #${numPedido}</span>
                    </div>

                    <div style="text-align: left; font-size: 12px; color: #475569; margin-top: 10px; font-weight: 600;">
                        ${itemsAgrupados.length} items (Ctd.: ${totalCtd})
                    </div>
                </div>

                <div style="margin-top: 5px;">
                    ${itemsTicketHtml}
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 2px solid #1e293b; padding-top: 10px; font-size: 16px; font-weight: 700; color: #0f172a;">
                    <span>Total:</span>
                    <span>Q. ${pedido.total ? pedido.total.toFixed(2) : '0.00'}</span>
                </div>
            `;

            document.getElementById('contenidoTicketRecibo').innerHTML = contenido;
            document.getElementById('modalTicket').style.display = 'flex';
        }

        function cerrarTicketModal() {
            document.getElementById('modalTicket').style.display = 'none';
        }

        function compartirTicket() {
            if (navigator.share) {
                navigator.share({
                    title: 'Ticket de Pedido - Hebron',
                    text: 'Aquí tienes los detalles de tu pedido en Hebron casa de eventos.',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                alert('La función de compartir no está soportada en este navegador.');
            }
        }
    </script>
</body>
</html>

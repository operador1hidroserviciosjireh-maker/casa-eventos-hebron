<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hebron Casa Retiro y Eventos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f9fc;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px 15px;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      text-align: center;
      padding: 25px 20px;
    }
    .logo-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
      border-radius: 50%;
      border: 2px solid #e0e0e0;
      padding: 5px;
      background: #fff;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    h1 {
      font-size: 22px;
      color: #1a1a1a;
      margin-bottom: 5px;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .location {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      color: #ffffff;
      transition: opacity 0.2s ease;
    }
    .btn:active { opacity: 0.85; }
    
    /* Colores corporativos */
    .btn-kyte { background-color: #00c853; }
    .btn-call { background-color: #25d366; }
    .btn-tiktok { background-color: #000000; }
    .btn-facebook { background-color: #1877f2; }
    .btn-instagram { background-color: #e1306c; }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <!-- Reemplaza src por la ruta o URL de tu logo -->
      <img src="https://via.placeholder.com/150" alt="Hebron Logo">
    </div>

    <h1>Hebron Casa Retiro</h1>
    <p class="subtitle">Casa de Retiros y Eventos</p>
    <p class="location">📍 Km. 30.5, Carretera a El Salvador, Guatemala</p>

    <!-- Botón Catálogo Kyte -->
    <a href="https://hebron-casa-de-eventos.kyte.site" class="btn btn-kyte" target="_blank">
      🛒 Ver Catálogo y Pedidos
    </a>

    <!-- Botón Llamar Directo -->
    <a href="tel:+50250390762" class="btn btn-call">
      📞 Llamar Directo (50390762)
    </a>

    <!-- Redes Sociales -->
    <a href="https://www.tiktok.com/@tu-usuario" class="btn btn-tiktok" target="_blank">
      🎵 TikTok
    </a>

    <a href="https://www.facebook.com/hebroncasaretiro" class="btn btn-facebook" target="_blank">
      📘 Facebook
    </a>

    <a href="https://www.instagram.com/tu-usuario" class="btn btn-instagram" target="_blank">
      📸 Instagram
    </a>

    <footer>
      © Hebron Casa Retiro y Eventos
    </footer>
  </div>

</body>
</html>

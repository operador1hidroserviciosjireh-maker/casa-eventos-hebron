<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hebron Casa Retiro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .card {
      background: #ffffff;
      max-width: 400px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 30px 20px;
      text-align: center;
    }

    .logo-container {
      width: 100px;
      height: 100px;
      margin: 0 auto 15px;
      border-radius: 50%;
      overflow: hidden;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 22px;
      color: #111827;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 6px;
    }

    .location {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      color: #ffffff;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-catalog { background-color: #22c55e; }
    .btn-phone { background-color: #16a34a; }
    .btn-tiktok { background-color: #000000; }
    .btn-facebook { background-color: #1877f2; }
    .btn-instagram { background-color: #e1306c; }

    /* Galería de imágenes */
    .gallery-title {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin: 20px 0 10px;
      text-align: left;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .gallery img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
    }

    footer {
      margin-top: 15px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <img src="logo.jpg" alt="Hebron Logo">
    </div>

    <h1>Hebron Casa Retiro</h1>
    <p class="subtitle">Casa de Retiros y Eventos</p>
    <p class="location">Km. 30.5, Carretera a El Salvador, Guatemala</p>

    <a href="https://hebron-casa-de-eventos.kyte.site" class="btn btn-catalog" target="_blank">
      Ver Catálogo y Pedidos
    </a>

    <a href="tel:+50250390762" class="btn btn-phone">
      Llamar Directo (50390762)
    </a>

    <a href="https://www.tiktok.com/@hebron8429" class="btn btn-tiktok" target="_blank">
      TikTok
    </a>

    <a href="https://www.facebook.com/profile.php?id=61578139898229&locale=es_LA" class="btn btn-facebook" target="_blank">
      Facebook
    </a>

    <a href="https://www.instagram.com/tu-usuario" class="btn btn-instagram" target="_blank">
      Instagram
    </a>

    <!-- Sección de Galería de Imágenes -->
    <p class="gallery-title">Nuestras Instalaciones</p>
    <div class="gallery">
      <img src="foto1.jpg" alt="Instalaciones 1">
      <img src="foto2.jpg" alt="Instalaciones 2">
      <img src="foto3.jpg" alt="Instalaciones 3">
      <img src="foto4.jpg" alt="Instalaciones 4">
    </div>

    <footer>
      © Hebron Casa Retiro y Eventos
    </footer>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Hebron Casa de Eventos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f6f8; min-height: 100vh; display: flex; flex-direction: column; color: #334155; }
        
        .header-catalogo { background-color: #253342; color: white; padding: 25px 20px; text-align: center; }
        .header-catalogo h1 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .header-catalogo p { font-size: 12px; color: #94a3b8; }

        .container { padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; flex-grow: 1; }
        
        .back-link { display: inline-block; color: #0ea5e9; text-decoration: none; font-size: 13px; font-weight: 500; margin-bottom: 15px; }
        .back-link:hover { text-decoration: underline; }

        /* Barra de Búsqueda estilo Kyte */
        .search-container { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; background: white; transition: border-color 0.2s; }
        .search-input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); }

        /* Grid de Productos */
        .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .producto-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 1px solid #e2e8f0; }
        
        /* Contenedor y ajuste perfecto de la imagen (tanto grandes como chicas) */
        .producto-img-container { 
            width: 100%; 
            height: 190px; 
            background: #f8fafc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative; 
            padding: 10px; 
        }
        
        .producto-img-container img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }
        .producto-sin-foto { color: #94a3b8; font-size: 12px; }

        .producto-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .producto-nombre { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
        .producto-precio { font-size: 16px; font-weight: 700; color: #10b981; margin-bottom: 12px; }
        
        .btn-accion { background-color: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; text-align: center; transition: background 0.2s; }
        .btn-accion:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="header-catalogo">
        <h1>Hebron Casa de Eventos</h1>
        <p>Catálogo Digital Sincronizado</p>
    </div>

    <div class="container">
        <a href="admin.html" class="back-link">← Volver al panel</a>

        <!-- Buscador en tiempo real -->
        <div class="search-container">
            <input type="text" id="inputBuscar" class="search-input" placeholder="Buscar productos..." onkeyup="filtrarCatalogo()">
        </div>

        <!-- Contenedor de Productos -->
        <div id="grid-catalogo" class="productos-grid">
            <p style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px;">Cargando catálogo...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uidoqzlzvhjhfzxmkgci.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZG9xemx6dmhqaGZ6eG1rZ2NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTg2ODAsImV4cCI6MjEwNTE3NDY4MH0.nunRdJoQcQR3N5K7H1-Rj3eZivWf0Kax_gjoNZSPcrI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let listaProductosGlobal = [];

        document.addEventListener('DOMContentLoaded', cargarDatos);

        async function cargarDatos() {
            const { data, error } = await supabaseClient
                .from('productos')
                .select('*')
                .order('created_at', { ascending: false });

            const grid = document.getElementById('grid-catalogo');

            if (error) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #ef4444;">Error al cargar: ${error.message}</p>`;
                return;
            }

            listaProductosGlobal = data || [];
            renderizarProductos(listaProductosGlobal);
        }

        function renderizarProductos(productos) {
            const grid = document.getElementById('grid-catalogo');
            grid.innerHTML = '';

            if (!productos || productos.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 40px;">No se encontraron productos.</p>`;
                return;
            }

            productos.forEach(p => {
                let imgHtml = p.foto 
                    ? `<img src="${p.foto}" alt="${p.nombre}">` 
                    : `<span class="producto-sin-foto">Sin imagen</span>`;
                
                let precioFormateado = `Q. ${parseFloat(p.precio || 0).toFixed(2)}`;
                let stockTexto = p.controlar_stock ? `Stock: ${p.stock || 0}` : `Disponible`;

                grid.innerHTML += `
                    <div class="producto-card">
                        <div class="producto-img-container">
                            ${imgHtml}
                        </div>
                        <div class="producto-info">
                            <div>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                    <h3 class="producto-nombre">${p.nombre}</h3>
                                    <span style="font-size: 11px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; color: #475569;">${stockTexto}</span>
                                </div>
                                <div class="producto-precio">${precioFormateado}</div>
                            </div>
                            <button onclick="seleccionar('${p.nombre}', ${p.precio})" class="btn-accion">Seleccionar</button>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarCatalogo() {
            const texto = document.getElementById('inputBuscar').value.toLowerCase();
            const filtrados = listaProductosGlobal.filter(p => 
                p.nombre && p.nombre.toLowerCase().includes(texto)
            );
            renderizarProductos(filtrados);
        }

        function seleccionar(nombre, precio) {
            alert(`Seleccionado: ${nombre} - Q. ${precio.toFixed(2)}`);
        }
    </script>
</body>
</html>
